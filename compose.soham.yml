# Hand to Avik — merge into the orchestrator compose. Replace YOUR_VM_IP.
services:
  risk-engine:
    build: ./services/risk-engine
    ports: ["8200:8200"]
    volumes: ["./services/risk-engine/artifacts:/app/artifacts:ro"]
    restart: unless-stopped

  web-victim:
    build:
      context: ./services/web/victim
      args: { VITE_USE_MOCKS: "true", VITE_API_BASE: "http://YOUR_VM_IP:8000" }
    ports: ["8081:80"]
    restart: unless-stopped

  web-counsellor:
    build:
      context: ./services/web/counsellor
      args: { VITE_USE_MOCKS: "true", VITE_RISK_BASE: "http://YOUR_VM_IP:8200" }
    ports: ["8082:80"]
    restart: unless-stopped
